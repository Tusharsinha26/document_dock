services:
  - type: web
    name: documentdock
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn documentdock.wsgi:application --log-file -"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: "documentdock_db"
